<!DOCTYPE html>
<html>

<head>
    <title>Tutorial 3 - Markers With Custom Icons</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        #map {
            height: 400px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // Same map and basemap as Tutorial 1
        var map = L.map('map').setView([51.5, -0.09], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // A reusable icon so each leaf only needs its own image. Size and anchor are in pixels.
        var LeafIcon = L.Icon.extend({
            options: {
                shadowUrl: 'leaf-shadow.png',  // same shadow image for all three leaves
                iconSize: [38, 95],        // width, height of the leaf image
                shadowSize: [50, 64],        // width, height of the shadow image
                iconAnchor: [22, 94],        // the pixel on the leaf that sits exactly on the map coordinate (the stem tip)
                shadowAnchor: [4, 62],         // the same idea for the shadow
                popupAnchor: [-3, -76]        // where the popup opens, measured from iconAnchor (negative = up/left)
            }
        });

        // Three icons from the template
        var greenIcon = new LeafIcon({ iconUrl: 'leaf-green.png' }),
            redIcon = new LeafIcon({ iconUrl: 'leaf-red.png' }),
            orangeIcon = new LeafIcon({ iconUrl: 'leaf-orange.png' });

        // Markers that use the custom icons instead of the default blue pin
        L.marker([51.5, -0.09], { icon: greenIcon }).addTo(map).bindPopup("I am a green leaf.");
        L.marker([51.495, -0.083], { icon: redIcon }).addTo(map).bindPopup("I am a red leaf.");
        L.marker([51.49, -0.1], { icon: orangeIcon }).addTo(map).bindPopup("I am an orange leaf.");
    </script>
</body>

</html>
