<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Original cartoon: a frazzled department chair, papers flying, coffee in hand -->

  <!-- Background circle; everything after it is trimmed to the circle -->
  <clipPath id="round"><circle cx="100" cy="100" r="96"/></clipPath>
  <circle cx="100" cy="100" r="96" fill="#e8eef5"/>
  <g clip-path="url(#round)">

  <!-- Flying papers -->
  <g stroke="#1f3a5f" stroke-width="2" fill="#ffffff">
    <rect x="18" y="40" width="30" height="38" transform="rotate(-25 33 59)"/>
    <rect x="150" y="30" width="30" height="38" transform="rotate(20 165 49)"/>
    <rect x="152" y="108" width="28" height="34" transform="rotate(35 166 125)"/>
  </g>
  <g stroke="#9aa9b8" stroke-width="2">
    <line x1="24" y1="52" x2="42" y2="44"/>
    <line x1="27" y1="60" x2="45" y2="52"/>
    <line x1="156" y1="40" x2="172" y2="46"/>
    <line x1="154" y1="48" x2="170" y2="54"/>
  </g>

  <!-- Body / shirt and tie -->
  <path d="M55 200 C55 160, 75 148, 100 148 C125 148, 145 160, 145 200 Z" fill="#1f3a5f"/>
  <path d="M100 150 L93 162 L100 195 L107 162 Z" fill="#8a1c2b"/>

  <!-- Neck and head -->
  <rect x="91" y="132" width="18" height="18" fill="#f2c9a0"/>
  <ellipse cx="100" cy="105" rx="34" ry="38" fill="#f2c9a0" stroke="#333333" stroke-width="2"/>

  <!-- Wild hair: spikes going every direction -->
  <path d="M68 92 L58 70 L76 80 L74 56 L88 74 L94 48 L102 72 L114 50 L114 76 L132 60 L126 84 L144 78 L132 96
           C128 78, 112 70, 100 70 C86 70, 72 78, 68 92 Z"
        fill="#7a7a7a" stroke="#333333" stroke-width="2" stroke-linejoin="round"/>

  <!-- Wide, mismatched eyes -->
  <circle cx="87" cy="102" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <circle cx="114" cy="102" r="12" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <circle cx="89" cy="104" r="3.5" fill="#333333"/>
  <circle cx="111" cy="99" r="3.5" fill="#333333"/>

  <!-- Eyebrows raised in alarm -->
  <path d="M77 88 L95 84" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 82 L124 88" stroke="#333333" stroke-width="3" stroke-linecap="round"/>

  <!-- Wobbly mouth -->
  <path d="M86 125 Q92 119, 98 125 T110 125 T118 123" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sweat drops -->
  <path d="M136 98 C132 106, 132 110, 136 112 C140 110, 140 106, 136 98 Z" fill="#7fb3e0"/>
  <path d="M64 108 C61 114, 61 117, 64 118 C67 117, 67 114, 64 108 Z" fill="#7fb3e0"/>

  <!-- Stress scribble above the head -->
  <path d="M84 36 C92 24, 104 44, 112 30 C118 20, 128 38, 120 40 C112 42, 104 22, 96 34"
        fill="none" stroke="#8a1c2b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Coffee mug with steam, held up -->
  <rect x="38" y="140" width="24" height="28" rx="3" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <path d="M62 146 C72 146, 72 162, 62 162" fill="none" stroke="#333333" stroke-width="2"/>
  <path d="M44 134 C40 128, 48 124, 44 118" fill="none" stroke="#9aa9b8" stroke-width="2"/>
  <path d="M54 134 C50 128, 58 124, 54 118" fill="none" stroke="#9aa9b8" stroke-width="2"/>
  <text x="50" y="159" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8a1c2b">CTE</text>
  </g>
</svg>
