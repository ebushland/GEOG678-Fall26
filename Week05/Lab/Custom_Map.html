<!DOCTYPE html>
<html>

<head>
    <title>Erik Bushland's First Web Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // Initialize the map
        var map = L.map('map').setView([30.6084, -96.3402], 13
        );

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // TAMU landmarks coordinates
        var kyleField = [30.609884, -96.340387];
        var omBuilding = [30.617703, -96.33666];
        var academicBuilding = [30.615838, -96.340797];

        // Try to locate the user
        map.locate({ setView: true, maxZoom: 16 });

        // Location found event handler
        function onLocationFound(e) {
            var radius = e.accuracy / 2;
            L.marker(e.latlng).addTo(map)
                .bindPopup("You are within " + radius + " meters from this point").openPopup();
            L.circle(e.latlng, radius).addTo(map);
        }

        // Location error event handler
        function onLocationError(e) {
            // If geolocation fails, center on Kyle Field
            map.setView(kyleField, 15);
            alert("Location access was denied or unavailable. Map centered on Kyle Field.");
        }

        // A circle: radius in meters
        var circle = L.circle(kyleField, {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 200
        }).addTo(map).bindPopup("<b>Kyle Field</b><br>Home of the 12th Man");

        var BuildingIcon = L.Icon.extend({
            options: {
                iconSize: [32, 42],   // display size in pixels
                iconAnchor: [16, 41],   // bottom tip of the pin sits on the coordinate
                popupAnchor: [0, -38]    // popup opens just above the pin's head
            }
        });

        // Icons for buildings.
        var academicIcon = new BuildingIcon({ iconUrl: 'academic-icon.png' }),
            omIcon = new BuildingIcon({ iconUrl: 'om-icon.png' });

        L.marker(academicBuilding, { icon: academicIcon }).addTo(map)
            .bindPopup("<b>Academic Building</b>");

        L.marker(omBuilding, { icon: omIcon }).addTo(map)
            .bindPopup("<b>O&amp;M Building</b><br>Oceanography &amp; Meteorology");

        // One reusable popup for map clicks. The tutorial reuses the name "popup" for this;
        // I renamed it so the two popups don't get confused
        var clickPopup = L.popup();

        // Leaflet passes an event object "e" where you clicked
        function onMapClick(e) {
            clickPopup
                .setLatLng(e.latlng)
                .setContent("You clicked the map at " + e.latlng.toString())
                .openOn(map);
        }

        // Run onMapClick for every click. 
        map.on('click', onMapClick);

        // Register event handlers
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);
    </script>
</body>

</html>
